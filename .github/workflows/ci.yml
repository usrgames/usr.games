name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Never download a different Go than the one the job asked for.
env:
  GOTOOLCHAIN: local

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, vet and the tests: the pages and the drawn files are what their sources say,
  # every page carries the tags the go command reads, and every local link names a file.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: make check
      # make check skips shellcheck where there is none. Here it has to have run.
      - name: the installer and the scripts are clean by shellcheck
        run: |
          command -v shellcheck > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends shellcheck; }
          shellcheck --version
          shellcheck -s sh site/install.sh scripts/pin.sh scripts/player.sh

  # The installer as a player runs it, on each kind of machine there is a runner for: from
  # GitHub, and then against a copy of tty1's latest release, spoiled in each way it must refuse.
  # Its test skips itself without the copy, so it is run here by name. The pin script's test needs
  # no download, so it runs in check too; here it is tried on each kind of machine.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: the installer, from GitHub, into a new home
        run: |
          home="$RUNNER_TEMP/home"
          mkdir "$home"
          HOME="$home" sh < site/install.sh
          "$home/.local/bin/tty1" --version
      # tty1's repository is public, so its latest release, archives and all, is downloaded as a
      # player's machine would. The releases of the relay and of rustwake are kept in the
      # repository instead, since their repositories are private (#33).
      - name: the latest release of tty1
        run: |
          mkdir -p "$RUNNER_TEMP/tty1"
          for f in manifest.json manifest.json.sig; do
            curl -fsSL -o "$RUNNER_TEMP/tty1/$f" "https://github.com/usrgames/tty1/releases/latest/download/$f"
          done
          v=$(jq -r .version "$RUNNER_TEMP/tty1/manifest.json")
          for f in $(jq -r '.files[].name' "$RUNNER_TEMP/tty1/manifest.json"); do
            curl -fsSL -o "$RUNNER_TEMP/tty1/$f" "https://github.com/usrgames/tty1/releases/download/$v/$f"
          done
      - name: the installer and the pin script refuse what they must
        env:
          TTY1_RELEASE: ${{ runner.temp }}/tty1
        run: |
          go test ./internal/sitecheck -run '^(TestTheInstaller|TestThePinScript)$' -count=1 -v | tee installer.txt
          grep -- '--- PASS: TestTheInstaller ' installer.txt
          grep -- '--- PASS: TestThePinScript ' installer.txt
